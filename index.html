<style>
  :root { --accent: #0f7d5a; --bg: #f6f2ea; --card: #fffdf9; --fg: #1f2430;
          --muted: #5f6573; --border: #e6dfd2; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
         Roboto, sans-serif; background: var(--bg); color: var(--fg);
         min-height: 100vh; display: flex; align-items: center;
         justify-content: center; padding: 20px; }
  .gate { background: var(--card); border: 1px solid var(--border);
          border-radius: 16px; padding: 36px 32px; max-width: 380px; width: 100%;
          box-shadow: 0 12px 40px rgba(0,0,0,0.12); text-align: center; }
  .gate h1 { font-size: 1.3rem; margin: 0 0 6px; }
  .gate .sub { color: var(--muted); font-size: .9rem; margin: 0 0 24px;
               line-height: 1.5; }
  .gate .lock { font-size: 2.6rem; margin-bottom: 12px; }
  .gate .lock img { width: 64px; height: 64px; border-radius: 14px; display: block; margin: 0 auto; }
  .gate input { width: 100%; padding: 13px 15px; font-size: 1.05rem;
                border: 2px solid var(--border); border-radius: 10px;
                background: var(--bg); color: var(--fg); margin-bottom: 14px;
                font-family: inherit; }
  .gate input:focus { outline: none; border-color: var(--accent); }
  .gate button { width: 100%; padding: 13px; font-size: 1.05rem; font-weight: 600;
                 background: var(--accent); color: #fff; border: none;
                 border-radius: 10px; cursor: pointer; font-family: inherit; }
  .gate button:hover { filter: brightness(1.08); }
  .gate button:disabled { opacity: .6; cursor: default; }
  .gate .err { color: #c0392b; font-size: .88rem; margin-top: 14px; min-height: 1em; }
  .gate .status { color: var(--muted); font-size: .85rem; margin-top: 14px; }
  .gate .hint { color: var(--muted); font-size: .78rem; margin: 14px 0 0; line-height: 1.4; }
  .vh { position: absolute !important; width: 1px; height: 1px; padding: 0 !important;
        margin: -1px; overflow: hidden; clip: rect(0 0 0 0); border: 0 !important;
        opacity: 0; }
</style>
</head>

      <input type="password" name="password" id="pw" placeholder="Passwort"

      <button type="submit" id="btn">Entsperren</button>

  <script>
  (function () {
    var PAYLOAD = JSON.parse(document.getElementById('payload').textContent);
    var form = document.getElementById('form');
    var pwInput = document.getElementById('pw');
    var btn = document.getElementById('btn');
    var errEl = document.getElementById('err');
    var statusEl = document.getElementById('status');
    var REMEMBER_KEY = 'einkaufradar-gate-pw';   // eigener Name: OsnaEvents liegt unter derselben github.io-Adresse

    function b64ToBytes(b64) {
      var bin = atob(b64);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    var busy = false;
    async function decryptAndShow(password, silent) {
      if (busy) return;
      busy = true;
      errEl.textContent = '';
      statusEl.textContent = 'Entschlüssele …';
      btn.disabled = true;
      try {
        var enc = new TextEncoder();
        var salt = b64ToBytes(PAYLOAD.salt);
        var iv = b64ToBytes(PAYLOAD.iv);
        var data = b64ToBytes(PAYLOAD.data);
        var keyMaterial = await crypto.subtle.importKey(
          'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
        var key = await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: PAYLOAD.iter, hash: 'SHA-256' },
          keyMaterial, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        var plainBuf = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv }, key, data);
        // gunzip via DecompressionStream
        statusEl.textContent = 'Lade …';
        var ds = new DecompressionStream('gzip');
        var stream = new Response(plainBuf).body.pipeThrough(ds);
        var htmlText = await new Response(stream).text();
        // Passwort optional merken (nur dieses Gerät)
        try { sessionStorage.setItem(REMEMBER_KEY, password); } catch (e) {}
        // Kennung dieser Fassung merken: die Seite erkennt daran, wann eine neue veröffentlicht ist
        try { sessionStorage.setItem('einkaufradar-iv', PAYLOAD.iv); } catch (e) {}
        // Inhalt anzeigen: ganzes Dokument ersetzen
        document.open();
        document.write(htmlText);
        document.close();
      } catch (e) {
        busy = false;
        btn.disabled = false;
        statusEl.textContent = '';
        try { sessionStorage.removeItem(REMEMBER_KEY); } catch (e2) {}
        if (silent) return;   // Autofill-Versuch: still scheitern, Feld nicht leeren
        errEl.textContent = 'Falsches Passwort. Groß-/Kleinschreibung beachten – und nicht das OsnaEvents-Passwort (gleiche Adresse).';
        pwInput.value = '';
        pwInput.focus();
      }
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pw = (pwInput.value || '').trim();
      if (pw) decryptAndShow(pw, false);
    });

    // Automatisch entsperren, sobald der Passwortmanager (Face ID) das Feld
    // füllt — dann ist kein Tipp auf „Entsperren" mehr nötig. Erkennung: Der
    // Wert springt auf einen Schlag um mehrere Zeichen (Autofill/Einfügen),
    // statt Buchstabe für Buchstabe zu wachsen. Beim normalen Tippen passiert
    // also nichts Ungewolltes.
    var lastLen = 0;
    function maybeAutofilled() {
      var v = (pwInput.value || '').trim();
      if (v.length - lastLen >= 4) decryptAndShow(v, true);
      lastLen = v.length;
    }
    pwInput.addEventListener('input', maybeAutofilled);
    pwInput.addEventListener('change', maybeAutofilled);
    // Manche iOS-Versionen füllen ohne input-Ereignis → kurz nachsehen
    setTimeout(maybeAutofilled, 600);

    // Auto-Entsperren, wenn in dieser Sitzung schon eingegeben
    if (!('DecompressionStream' in window)) {
      errEl.textContent = 'Dieser Browser ist zu alt (kein DecompressionStream).';
    } else {
      try {
        var saved = sessionStorage.getItem(REMEMBER_KEY);
        if (saved) decryptAndShow(saved);
      } catch (e) {}
    }
  })();
  </script>
